<!DOCTYPE html>
<html>
<head>
    <title>Credit Card Details</title>

    <style>
        table {
            border-collapse: collapse;
            width: 80%;
            margin-top: 20px;
        }

        th, td {
            border: 1px solid black;
            padding: 8px;
            text-align: center;
        }

        th {
            background-color: #f2f2f2;
        }

        #message {
            margin-top: 15px;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <h2>Credit Card Details</h2>

    <div id="message"></div>
    <div id="tableContainer"></div>

    <script>
        let cards = [];

        // Create AJAX request
        let xhr = new XMLHttpRequest();

        // Open GET request
        xhr.open(
            "GET",
            "https://webapps.tekstac.com/WebAPI/CreditCardsXMLServlet",
            true
        );

        // Handle response
        xhr.onreadystatechange = function () {

            if (xhr.readyState === 4 && xhr.status === 200) {

                // Get XML response
                let xml = xhr.responseXML;

                // Get all CreditCard elements
                let cardList = xml.getElementsByTagName("CreditCard");

                // Extract each credit card
                for (let i = 0; i < cardList.length; i++) {

                    let card = cardList[i];

                    let cardObject = {
                        cardHolderName:
                            card.getElementsByTagName("CardHolderName")[0].textContent,

                        cardType:
                            card.getElementsByTagName("CardType")[0].textContent,

                        cardLimit:
                            card.getElementsByTagName("CardLimit")[0].textContent,

                        expiryDate:
                            card.getElementsByTagName("ExpiryDate")[0].textContent
                    };

                    cards.push(cardObject);
                }

                // Check whether all 16 records are retrieved
                if (cards.length === 16) {
                    document.getElementById("message").innerHTML =
                        "Data retrieved successfully.";
                }

                // Generate table
                generateTable();
            }
        };

        // Send AJAX request
        xhr.send();


        // Function to generate table
        function generateTable() {

            let table = document.createElement("table");

            // Create header row
            let headerRow = table.insertRow();

            let headers = [
                "Card Holder Name",
                "Card Type",
                "Card Limit",
                "Expiry Date"
            ];

            for (let i = 0; i < headers.length; i++) {

                let th = document.createElement("th");

                th.textContent = headers[i];

                headerRow.appendChild(th);
            }


            // Create rows for all cards
            for (let i = 0; i < cards.length; i++) {

                let row = table.insertRow();

                let cell1 = row.insertCell();
                let cell2 = row.insertCell();
                let cell3 = row.insertCell();
                let cell4 = row.insertCell();

                // IMPORTANT: cardHolderName, not cardName
                cell1.textContent = cards[i].cardHolderName;

                cell2.textContent = cards[i].cardType;

                cell3.textContent = cards[i].cardLimit;

                cell4.textContent = cards[i].expiryDate;
            }


            // Add table to webpage
            document.getElementById("tableContainer").appendChild(table);

            // Display success message
            document.getElementById("message").innerHTML +=
                "<br>Report generated successfully!!!";
        }
    </script>

</body>
</html>
